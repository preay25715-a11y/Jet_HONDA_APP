name: Build Jet Smart Gauge APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build web app into Android assets
        run: python3 build.py

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Read version
        id: ver
        run: echo "v=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Jet_Smart_Gauge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jet_Smart_Gauge-apk
          path: Jet_Smart_Gauge.apk

      - name: Publish to Releases (download straight from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Jet Smart Gauge v${{ steps.ver.outputs.v }}
          files: Jet_Smart_Gauge.apk
          make_latest: true

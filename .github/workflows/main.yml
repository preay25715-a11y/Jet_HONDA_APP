name: Build Jet_HONDA Tune APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          B=$(find . -name build.py -not -path "./.git/*" | head -1)
          if [ -z "$B" ]; then echo "ไม่พบ build.py — อัปโหลดไฟล์จาก zip ให้ครบ"; exit 1; fi
          echo "PROJ=$(dirname "$B")" >> $GITHUB_ENV
          echo "Project folder: $(dirname "$B")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJ/android/local.properties"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build web app into Android assets
        run: cd "$PROJ" && python3 build.py

      - name: Build APK
        run: cd "$PROJ/android" && gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: cp "$PROJ/android/app/build/outputs/apk/release/app-release.apk" Jet_HONDA_Tune.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jet_HONDA_Tune-apk
          path: Jet_HONDA_Tune.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jet_HONDA Tune build ${{ github.run_number }}
          files: Jet_HONDA_Tune.apk
          make_latest: true

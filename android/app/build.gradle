plugins { id 'com.android.application' }

android {
    namespace 'com.jet.hondatune'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jet.hondatune'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        jet {
            storeFile file('jet-release.jks')
            storePassword 'jethonda123'
            keyAlias 'jet'
            keyPassword 'jethonda123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.jet }
        debug { signingConfig signingConfigs.jet }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'
}

plugins { id 'com.android.application' }

def verName = new File(rootProject.projectDir, '../VERSION').text.trim()
def verParts = verName.tokenize('.')
def verCode = verParts[0].toInteger() * 10000 + verParts[1].toInteger() * 100 + verParts[2].toInteger()

android {
    namespace 'com.jet.hondatune'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jet.hondatune'
        minSdk 24
        targetSdk 35
        versionCode verCode
        versionName verName
    }
    signingConfigs {
        jet {
            storeFile file('jet-release.jks')
            storePassword 'jethonda123'
            keyAlias 'jet'
            keyPassword 'jethonda123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.jet }
        debug { signingConfig signingConfigs.jet }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'
}
